workflows:
  cinemora-ios-simulator:
    name: Cinemora iOS Simulator Preview (.app)
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      cocoapods: default
      vars:
        API_BASE_URL: https://cungcapicloud.id.vn
    scripts:
      - name: Install XcodeGen
        script: |
          if ! command -v xcodegen >/dev/null 2>&1; then brew install xcodegen; fi

      - name: Prepare native SwiftUI project for simulator
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/mobile-swiftui"
          MODELS_ACCOUNT='Sources/Cinemora/Models/AccountModels.swift'
          STATE_ACCOUNT='Sources/Cinemora/State/AccountModels.swift'
          if [ -f "$MODELS_ACCOUNT" ] && [ -f "$STATE_ACCOUNT" ]; then
            mv "$STATE_ACCOUNT" 'Sources/Cinemora/State/AccountModelsState.swift'
          fi
          DUPLICATE_SWIFT_BASENAMES="$(find Sources/Cinemora -type f -name '*.swift' -print | sed 's#^.*/##' | sort | uniq -d)"
          if [ -n "$DUPLICATE_SWIFT_BASENAMES" ]; then
            echo "ERROR: duplicate Swift basenames remain: $DUPLICATE_SWIFT_BASENAMES"
            exit 1
          fi
          xcodegen generate --spec project.yml
          test -d Cinemora.xcodeproj

      - name: Build unsigned iOS Simulator app
        script: |
          set -euo pipefail
          xcodebuild build \
            -project "$CM_BUILD_DIR/mobile-swiftui/Cinemora.xcodeproj" \
            -scheme Cinemora \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Verify simulator app artifact
        script: |
          set -euo pipefail
          APP_PATH="$(find /Users/builder/Library/Developer/Xcode/DerivedData -path '*/Build/Products/Debug-iphonesimulator/Cinemora.app' -print -quit)"
          test -n "$APP_PATH"
          test -d "$APP_PATH"
          echo "Simulator preview artifact: $APP_PATH"
    artifacts:
      - /Users/builder/Library/Developer/Xcode/DerivedData/**/Build/Products/Debug-iphonesimulator/*.app
      - /tmp/xcodebuild_logs/*.log

